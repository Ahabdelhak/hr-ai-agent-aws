<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.6;rx:10}
      .core{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:10}
      .data{fill:#ecfdf5;stroke:#059669;stroke-width:1.6;rx:10}
      .plan{fill:#fff;stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:6 4;rx:10}
      .t{font-size:15px;font-weight:600;fill:#0f172a}
      .s{font-size:12px;fill:#475569}
      .l{font-size:12px;fill:#334155;font-style:italic}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .lt{font-size:22px;font-weight:700;fill:#0f172a}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="40" y="44" class="lt">hr-ai-agent-aws: HR assistant that answers and acts</text>
  <text x="40" y="66" class="s">Amazon Bedrock AgentCore (Runtime + Gateway over MCP) + Knowledge Base + Lambda + DynamoDB</text>

  <rect class="box" x="40" y="260" width="130" height="70"/><text x="105" y="292" text-anchor="middle" class="t">Employee</text><text x="105" y="312" text-anchor="middle" class="s">Chat UI</text>

  <rect class="box" x="220" y="260" width="170" height="70"/><text x="305" y="292" text-anchor="middle" class="t">Chat web app</text><text x="305" y="312" text-anchor="middle" class="s">Streamlit behind ALB</text>

  <rect class="core" x="440" y="240" width="200" height="110"/><text x="540" y="278" text-anchor="middle" class="t">AgentCore Runtime</text><text x="540" y="300" text-anchor="middle" class="s">hr_assistant agent</text><text x="540" y="320" text-anchor="middle" class="s">chooses tool or answers</text>

  <rect class="box" x="440" y="110" width="200" height="70"/><text x="540" y="142" text-anchor="middle" class="t">Bedrock model</text><text x="540" y="162" text-anchor="middle" class="s">Nova Lite (on-demand)</text>

  <rect class="plan" x="440" y="430" width="200" height="70"/><text x="540" y="462" text-anchor="middle" class="t">Guardrails (planned)</text><text x="540" y="482" text-anchor="middle" class="s">filter input and output</text>

  <rect class="core" x="700" y="240" width="190" height="110"/><text x="795" y="278" text-anchor="middle" class="t">AgentCore Gateway</text><text x="795" y="300" text-anchor="middle" class="s">MCP endpoint</text><text x="795" y="320" text-anchor="middle" class="s">IAM-role outbound auth</text>

  <rect class="box" x="930" y="110" width="150" height="64"/><text x="1005" y="138" text-anchor="middle" class="t">hrKnowledgeBase</text><text x="1005" y="158" text-anchor="middle" class="s">KB target (RAG)</text>
  <rect class="box" x="930" y="262" width="150" height="64"/><text x="1005" y="290" text-anchor="middle" class="t">submitLeave</text><text x="1005" y="310" text-anchor="middle" class="s">Lambda + schema</text>
  <rect class="box" x="930" y="414" width="150" height="64"/><text x="1005" y="442" text-anchor="middle" class="t">submitBenefits</text><text x="1005" y="462" text-anchor="middle" class="s">Lambda + schema</text>

  <rect class="data" x="1100" y="110" width="90" height="64"/><text x="1145" y="138" text-anchor="middle" class="t">S3</text><text x="1145" y="158" text-anchor="middle" class="s">handbook</text>
  <rect class="data" x="1100" y="262" width="90" height="64"/><text x="1145" y="290" text-anchor="middle" class="t">Vacation</text><text x="1145" y="310" text-anchor="middle" class="s">DynamoDB</text>
  <rect class="data" x="1100" y="414" width="90" height="64"/><text x="1145" y="442" text-anchor="middle" class="t">Benefits</text><text x="1145" y="462" text-anchor="middle" class="s">DynamoDB</text>
  <rect class="data" x="700" y="430" width="190" height="64"/><text x="795" y="458" text-anchor="middle" class="t">S3: tool schemas</text><text x="795" y="478" text-anchor="middle" class="s">schema/*.json</text>

  <path class="ln" d="M170 295 H220"/>
  <path class="ln" d="M390 295 H440"/>
  <path class="ln" d="M540 240 V180"/>
  <path class="ln" d="M540 350 V430" stroke-dasharray="6 4"/>
  <path class="ln" d="M640 295 H700"/>
  <path class="ln" d="M890 270 C910 270 910 142 930 142"/>
  <path class="ln" d="M890 295 H930"/>
  <path class="ln" d="M890 320 C910 320 910 446 930 446"/>
  <path class="ln" d="M1080 142 H1100"/>
  <path class="ln" d="M1080 294 H1100"/>
  <path class="ln" d="M1080 446 H1100"/>
  <path class="ln" d="M795 430 V350"/>

  <text x="40" y="610" class="l">Solid = built in the lab. Dashed = planned for the portfolio build (guardrails). Chat app was unreachable from the author's browser, so the agent was also tested through the AgentCore Test agent console.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
